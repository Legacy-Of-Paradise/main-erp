- type: entity
  parent: [BaseMob, StripableInventoryBase]
  id: PlayerSiliconBase #for player controlled silicons
  components:
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: Input
    context: "human"
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Clickable
  - type: Damageable
    damageContainer: Inorganic
  - type: Bloodstream
    bloodReagent: Oil
    bloodlossDamage:
      types:
        Bloodloss:
          1
    bloodlossHealDamage:
      types:
        Bloodloss:
          -1
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          # Circles, cuz rotation of rectangles looks very bad
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 6
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Physics
    bodyType: KinematicController
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  - type: Body
    prototype: Bot
  - type: DoAfter
  - type: Pullable
  - type: Examiner
  - type: Puller
    needsHands: false
  - type: StandingState
  - type: Alerts
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
    wilhelmProbability: 0
  - type: TypingIndicator
    proto: robot
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Science
  - type: ZombieImmune
  - type: StaticPrice
    price: 3000
  - type: GuideHelp
    guides:
    - Robotics
  - type: Stamina
    critThreshold: 120
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-honkbot-name
    description: ghost-role-information-honkbot-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Emoting
  - type: Tag
    tags:
      - FootstepSound
      - SiliconEmotes
      - CannotSuicide
  - type: EyeProtection
    protectionTime: 12
  - type: CombatMode
  - type: ComplexInteraction
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBorg
  - type: ActionGrant
    actions:
    - ActionViewLaws
  - type: Access
    enabled: false
    groups:
    - AllAccess
    tags:
    - Borg
  - type: ShowJobIcons
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: NTDefault # Corvax-NTDefault
  - type: EmagSiliconLaw
    stunTime: 5


- type: entity
  noSpawn: true
  parent: ClothingBackpackSatchel
  id: BSSClothingBackpackSatchelDrone
  components:
  - type: Storage
    capacity: 9999
  - type: Tag
    tags:
    - InnateDontDelete
  - type: StorageFill
    contents:
      - id: trayScanner
      - id: Omnitool
      - id: WelderExperimental

- type: entity
  name: Blue Space Drone
  id: BackmenDrone
  parent: PlayerSiliconBase
  components:
  - type: InnateTool
  - type: NameIdentifier
    group: Silicon
  - type: Inventory
    templateId: drone
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
        requireInputValidation: false
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: GhostRole
    makeSentient: true
    allowSpeech: true # backmen
    allowMovement: true # backmen
    name: Блюспейс Дрон #ghost-role-information-drone-name # backmen
    description: ghost-role-information-drone-description # backmen
    rules: | # backmen
     Вы являетесь ВЫСШИМ интеллектом на станции.
     Вы связаны этими законами как в игре, так и вне персонажа:
     1. Ваша главная задача - поддерживать работу станции.
     2. Выживание и целостность станции превыше всего(даже экипажа).
     3. Вред станции недопустим.
  - type: GhostTakeoverAvailable
  - type: MovementSpeedModifier
    baseWalkSpeed : 5.5
    baseSprintSpeed : 6.8
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      120: Dead
  - type: NoSlip
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      100: 0.5
  - type: Temperature
    heatDamageThreshold: 5000
    currentTemperature: 310.15
    specificHeat: 42
    heatDamage:
      types:
        Heat : 1 #per second, scales with temperature & other constants
  - type: Sprite
    drawdepth: SmallMobs
    layers:
    - state: shell
      sprite: _Backmen/Mobs/Silicon/drone.rsi
      map: ["base"]
    - state: drone
      sprite: _Backmen/Mobs/Silicon/drone.rsi
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: MovementIgnoreGravity
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DroneVisuals.Status:
        base:
          Off: { state: shell }
          On: { state: drone }
  - type: ReplacementAccent
    accent: silicon
  - type: TTS
    voicePrototypeId: nyx_assassin_dota_2
  - type: Repairable
    fuelcost: 15
    doAfterDelay: 8
  - type: Actions
  - type: UnpoweredFlashlight
  #   toggleAction:
  #     name: action-name-toggle-light
  #     description: action-description-toggle-light
  #     icon: { sprite: Objects/Tools/flashlight.rsi, state: flashlight }
  #     iconOn: { sprite: Objects/Tools/flashlight.rsi, state: flashlight-on }
  #     event: !type:ToggleActionEvent
  - type: PointLight
    enabled: false
    radius: 4.25
    softness: 1
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Tag
    tags:
      - CanPilot
  - type: Loadout
    prototypes: [ LOPDroneBCD ]
  # - type: SpecForce
  #   requirements:
  #   - !type:OverallPlaytimeRequirement
  #     time: 36000
  #   - !type:RoleTimeRequirement
  #     role: JobChiefEngineer
  #     time: 24000

- type: startingGear
  id: LOPDroneBCD
  equipment:
    back: BSSClothingBackpackSatchelDrone
