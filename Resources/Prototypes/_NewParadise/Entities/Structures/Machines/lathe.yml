- type: entity
  id: LoPProtolatheEngineering
  parent: BaseLatheLube
  name: engineering protolathe
  description: Converts raw materials into advanced items. Engineering Edition. It has a label "BL CORP technology"
  components:
  - type: Sprite
    sprite: _NewParadise/Structures/Machines/protolatheENG.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: LoPProtolatheEngineeringMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - ToolsStatic
    - PartsStatic
    - MaterialsStatic
    - LightsStatic
    - PowerCellsStatic
    - ElectronicsStatic
    - AtmosStatic
    - CablesStatic
    - EngineeringBoardsStatic
    dynamicPacks:
    - LoPNVGPackEngi
    - AdvancedTools
    - PowerCells
    - AtmosTools
    - EngineeringWeapons
    - Equipment
    - FauxTiles
  - type: EmagLatheRecipes
    emagDynamicPacks:
    - SecurityAmmo
    - SecurityExplosives
    - SecurityEquipment
    - SecurityWeapons

