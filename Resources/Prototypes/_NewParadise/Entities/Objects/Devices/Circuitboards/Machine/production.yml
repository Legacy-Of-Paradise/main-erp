- type: entity
  id: LoPProtolatheEngineeringMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: engineering protolathe machine board
  description: A machine printed circuit board for a engineering protolathe.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: LoPProtolatheEngineering
      stackRequirements:
        Manipulator: 4
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

